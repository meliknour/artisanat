<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة الوصف الفني للمنتج</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-color: #000000;
      --border-color: #000000;
      --bg-light: #ffffff;
      --bg-header: #1a1a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', 'Calibri', Arial, sans-serif;
      background-color: #e5e5e5;
      color: var(--text-color);
      padding: 20px 10px;
      line-height: 1.4;
    }

    /* صفحة المستند */
    .word-page {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 40px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* هيدر المستند */
    .document-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .document-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #000;
    }

    .doc-number {
      font-size: 0.95rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      padding: 2px 10px;
      background-color: #fff;
    }

    /* قسم الصورة والعنوان الرئيسي */
    .product-top-section {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      background: #fff;
    }

    .product-image-container {
      flex-shrink: 0;
    }

    /* الصورة تظهر بالألوان الطبيعية في الموقع */
    .product-image {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      filter: none; /* ألوان طبيعية */
    }

    .product-title-main {
      flex-grow: 1;
    }

    .product-title-main h2 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }

    .product-title-main p {
      font-size: 0.95rem;
      margin-bottom: 3px;
    }

    /* جدول التفاصيل */
    .word-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
      font-size: 0.9rem;
      table-layout: fixed;
    }

    .word-table th, 
    .word-table td {
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      text-align: right;
      vertical-align: middle;
      word-wrap: break-word;
    }

    .word-table th {
      background-color: #fff;
      font-weight: 700;
    }

    .word-table td {
      background-color: #fff;
    }

    /* العناوين السوداء المظللة */
    .section-heading {
      background-color: var(--bg-header) !important;
      color: #ffffff !important;
      text-align: center !important;
      font-size: 0.95rem;
      padding: 6px !important;
      font-weight: bold;
    }

    /* أزرار الإجراءات */
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      padding: 8px 20px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #000;
      color: #fff;
    }

    .error-message {
      text-align: center;
      padding: 20px;
      border: 1px solid #000;
      background: #f0f0f0;
      font-weight: bold;
    }

    /* ========================================== */
    /* 🖨️ إعدادات الطباعة الدقيقة للحفاظ على الشكل */
    /* ========================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0.6cm;
      }
      
      html, body {
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .word-page {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .action-buttons {
        display: none !important;
      }

      /* تحويل الصورة إلى أبيض وأسود فقط عند الطباعة */
      .product-image {
        filter: grayscale(100%) !important;
        width: 110px !important;
        height: 110px !important;
      }

      /* إجبار الجداول على الحفاظ على شكل الأعمدة بدون تفكك */
      .word-table {
        display: table !important;
        width: 100% !important;
        table-layout: fixed !important;
        margin-bottom: 10px !important;
        font-size: 8.5pt !important;
      }

      .word-table tr {
        display: table-row !important;
      }

      .word-table th, 
      .word-table td {
        display: table-cell !important;
        padding: 4px 6px !important;
        border: 1px solid #000 !important;
      }

      /* تثبيت ألوان الخلفية للرؤوس سوداء أثناء الطباعة */
      .section-heading {
        background-color: #000000 !important;
        color: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .product-top-section {
        display: flex !important;
        flex-direction: row !important;
        padding: 8px !important;
        margin-bottom: 10px !important;
        border: 1px solid #000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="word-page">
    <!-- هيدر المستند -->
    <div class="document-header">
      <div class="document-title">بطاقة الوصف الفني للمنتج</div>
      <div class="doc-number">الرقم المرجعي: <span id="productNumber">---</span></div>
    </div>

    <!-- محتوى المنتج -->
    <div id="productDetails">⏳ جاري تحميل بيانات المستند...</div>

    <!-- الأزرار -->
    <div class="action-buttons">
      <a href="javascript:history.back()" class="btn">← العودة</a>
      <button onclick="window.print()" class="btn">🖨️ طباعة المستند</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      query, 
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDq-S2CBiNmccar_neNVg5T95XbwV6t0cY",
      authDomain: "artisanat-161f3.firebaseapp.com",
      projectId: "artisanat-161f3",
      storageBucket: "artisanat-161f3.appspot.com",
      messagingSenderId: "203989144161",
      appId: "1:203989144161:web:88273bf2b917ddc0a65020",
      measurementId: "G-9350J62Z5H"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    const container = document.getElementById("productDetails");
    const productNumberElement = document.getElementById("productNumber");

    function formatProductId(index) {
      if (typeof index !== 'number' || index < 1) return "---";
      return String(index).padStart(3, '0');
    }

    function val(value) {
      return (value && String(value).trim() !== "") ? value : "-";
    }

    async function loadProduct() {
      if (!productId) {
        productNumberElement.textContent = "---";
        container.innerHTML = "<p class='error-message'>لم يتم تحديد معرف المنتج.</p>";
        return;
      }

      try {
        const productsCollection = collection(db, "products");
        const q = query(productsCollection, orderBy("timestamp", "asc")); 
        const querySnapshot = await getDocs(q);

        let productData = null;
        let productIndex = -1;
        
        querySnapshot.docs.forEach((doc, index) => {
            if (doc.id === productId) {
                productData = doc.data();
                productIndex = index + 1; 
            }
        });

        if (productData) {
            productNumberElement.textContent = formatProductId(productIndex);
            const fallbackImg = "https://via.placeholder.com/130?text=No+Image";
            const imageUrl = productData.image || fallbackImg;

            container.innerHTML = `
              <!-- الجزء العلوي: الصورة والعنوان -->
              <div class="product-top-section">
                <div class="product-title-main">
                  <h2>${val(productData.name)}</h2>
                  <p><strong>النوع / التصنيف:</strong> ${val(productData.type)}</p>
                  <p><strong>المصدر / المنطقة:</strong> ${val(productData.source)}</p>
                </div>
                <div class="product-image-container">
                  <img src="${imageUrl}" 
                       alt="صورة المنتج" 
                       class="product-image" 
                       onerror="this.onerror=null;this.src='${fallbackImg}';">
                </div>
              </div>

              <!-- جدول المواصفات العامة والمالية -->
              <table class="word-table">
                <thead>
                  <tr>
                    <th colspan="4" class="section-heading">المواصفات العامة والمالية</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th style="width:20%;">السعر</th>
                    <td style="width:30%;">${val(productData.price)}</td>
                    <th style="width:20%;">مدة الإنجاز</th>
                    <td style="width:30%;">${val(productData.duration)}</td>
                  </tr>
                  <tr>
                    <th>الحجم</th>
                    <td>${val(productData.size)}</td>
                    <th>الوزن</th>
                    <td>${val(productData.weight)}</td>
                  </tr>
                  <tr>
                    <th>الألوان</th>
                    <td>${val(productData.colors)}</td>
                    <th>الإنتاج</th>
                    <td>${val(productData.production)}</td>
                  </tr>
                  <tr>
                    <th>الاستعمال</th>
                    <td>${val(productData.usage)}</td>
                    <th>عدد المتدخلين</th>
                    <td>${val(productData.people)}</td>
                  </tr>
                </tbody>
              </table>

              <!-- جدول التفاصيل الفنية ومراحل العمل -->
              <table class="word-table">
                <thead>
                  <tr>
                    <th colspan="2" class="section-heading">التفاصيل الفنية ومراحل العمل</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <th style="width:25%;">نوع التزيين والرموز</th>
                    <td style="width:75%;">${val(productData.decoration)}</td>
                  </tr>
                  <tr>
                    <th>المواد الأولية</th>
                    <td>${val(productData.materials)}</td>
                  </tr>
                  <tr>
                    <th>الأدوات المستعملة</th>
                    <td>${val(productData.tools)}</td>
                  </tr>
                  <tr>
                    <th>التقنيات المستعملة</th>
                    <td>${val(productData.techniques)}</td>
                  </tr>
                  <tr>
                    <th>التقنيات المبتكرة</th>
                    <td>${val(productData.innovation)}</td>
                  </tr>
                  <tr>
                    <th>مراحل الإنجاز</th>
                    <td>${val(productData.steps)}</td>
                  </tr>
                  <tr>
                    <th>تاريخ الإضافة</th>
                    <td>${productData.timestamp?.toDate ? productData.timestamp.toDate().toLocaleString('ar-DZ') : "-"}</td>
                  </tr>
                </tbody>
              </table>
            `;

        } else {
            productNumberElement.textContent = "---";
            container.innerHTML = "<p class='error-message'>المنتج المطلوب غير موجود.</p>";
        }
      } catch (error) {
        console.error("خطأ في جلب المنتج:", error);
        productNumberElement.textContent = "خطأ";
        container.innerHTML = "<p class='error-message'>حدث خطأ أثناء تحميل البيانات.</p>";
      }
    }

    loadProduct();
  </script>
</body>
</html>
